<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MaplePath – Latest News Updates</title>
    <link rel="stylesheet" href="css/output.css" />
  </head>

  <body
    class="text-white flex flex-col justify-center items-center bg-dark-grey"
  >
    <div id="header-template"></div>
    <main class="blog-main">
      <!-- Page Header -->
      <section class="flex flex-col gap-3 m-8">
        <h1 class="mb-1">Latest News Updates</h1>
      </section>

      <!-- Main Content Area -->
      <div class="blog-layout">
        <!-- Left Sidebar: Filters -->
        <aside class="filter-sidebar">
          <!-- Filters Panel -->
          <div class="filter-panel">
            <div class="filter-header">
              <h3 class="filter-title">Filters</h3>
              <svg
                class="filter-icon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <line x1="4" y1="6" x2="20" y2="6"></line>
                <line x1="4" y1="12" x2="20" y2="12"></line>
                <line x1="4" y1="18" x2="20" y2="18"></line>
                <circle cx="8" cy="6" r="2" fill="currentColor"></circle>
                <circle cx="16" cy="12" r="2" fill="currentColor"></circle>
                <circle cx="10" cy="18" r="2" fill="currentColor"></circle>
              </svg>
            </div>

            <!-- Type Filter -->
            <div class="filter-section">
              <button class="filter-toggle" data-filter="type">
                <span>Type</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
              <div class="filter-options hidden" id="filter-type">
                <label class="filter-option">
                  <input type="checkbox" value="citizenship" /> Citizenship
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="permanent-residency" />
                  Permanent Residency
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="provincial-nominee-program" />
                  Provincial Nominee Program
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="refugee-humanitarian" />
                  Refugee/Humanitarian
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="work-permit" /> Work Permit
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="post-graduate-work-permit" />
                  Post-Graduate Work Permit
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="study-permit" /> Study Permit
                </label>
              </div>
            </div>

            <!-- Source Filter -->
            <div class="filter-section">
              <button class="filter-toggle" data-filter="source">
                <span>Source</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
              <div class="filter-options hidden" id="filter-source">
                <label class="filter-option">
                  <input type="checkbox" value="IRCC" /> IRCC
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="CICC" /> CICC
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="Government" /> Government of
                  Canada
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="Media" /> Media
                </label>
              </div>
            </div>

            <!-- Region Filter -->
            <div class="filter-section">
              <button class="filter-toggle" data-filter="region">
                <span>Region</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
              <div class="filter-options hidden" id="filter-region">
                <label class="filter-option">
                  <input type="checkbox" value="All" /> All Regions
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="Africa" /> Africa
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="Asia-Pacific" /> Asia-Pacific
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="Europe" /> Europe
                </label>
                <label class="filter-option">
                  <input
                    type="checkbox"
                    value="Latin America and the Caribbean"
                  />
                  Latin America & Caribbean
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="Middle East and North Africa" />
                  Middle East & North Africa
                </label>
                <label class="filter-option">
                  <input type="checkbox" value="North America" /> North America
                </label>
              </div>
            </div>

            <!-- Time Filter -->
            <div class="filter-section">
              <button class="filter-toggle active" data-filter="time">
                <span>Time</span>
                <svg
                  class="chevron rotated"
                  width="16"
                  height="16"
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                >
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
              <div class="filter-options time-chips" id="filter-time">
                <button class="time-chip" data-days="1">Past 24 Hours</button>
                <button class="time-chip" data-days="7">Past Week</button>
                <button class="time-chip" data-days="30">Past Month</button>
                <button class="time-chip" data-days="180">Past 6 Months</button>
                <button class="time-chip selected" data-days="365">
                  Past 1 Year
                </button>
              </div>
            </div>

            <!-- Apply Filter Button -->
            <button class="apply-filter-btn" id="apply-filters">
              Apply Filter
            </button>
          </div>
        </aside>

        <!-- Right Content: Search + Articles -->
        <div class="articles-container">
          <!-- Search Bar -->
          <div class="search-bar">
            <svg
              class="search-icon"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input
              type="text"
              id="search-input"
              placeholder="Search for articles..."
            />
          </div>

          <!-- Articles List (populated dynamically from data/articles.json) -->
          <div class="articles-list" id="articles-list">
            <!-- Articles will be loaded here by blog.js -->
          </div>

          <!-- No Results Message -->
          <div class="no-results hidden" id="no-results">
            <p>No articles found matching your criteria.</p>
          </div>
        </div>
      </div>
    </main>
    <div id="footer-template"></div>
    <script src="js/template.js"></script>
    <script src="js/blog.js"></script>
  </body>
</html>
